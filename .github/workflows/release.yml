name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create draft-less release with notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag --title "$tag" --notes "Windows x64 installer. SHA-256 appended below after the build."
      - name: Bundle MCP server
        run: pnpm --filter @cross-agent-sync/mcp-server build
      - name: Build Windows installer (publishes assets to the release)
        run: pnpm --filter @cross-agent-sync/desktop build:win
        env:
          GH_TOKEN: ${{ github.token }}
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      - name: Append SHA-256 to release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = Get-ChildItem apps/desktop/dist/*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $old = gh release view $tag --json body -q .body
          $new = "$old`n`n**SHA-256 ($($exe.Name))**:`n``$hash``"
          gh release edit $tag --notes $new
